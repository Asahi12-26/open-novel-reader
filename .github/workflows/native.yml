name: Windows and Android builds
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['README.md', 'PROJECT_STATUS.md', 'docs/USAGE.md', 'docs/BUILD.md', 'docs/SYNC_AI.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: node scripts/check-release-version.mjs
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm test
      - run: npm run tauri -- build --bundles nsis --ci
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_PUBLIC_APP_URL: ${{ vars.VITE_PUBLIC_APP_URL || 'https://asahi12-26.github.io/open-novel-reader/' }}
          VITE_AUTH_EMAIL_MODE: ${{ vars.VITE_AUTH_EMAIL_MODE }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: native-cargo-lock
          path: src-tauri/Cargo.lock
          if-no-files-found: error
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      signed: ${{ steps.signing.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: node scripts/check-release-version.mjs
      - name: Select signed release or unsigned compile candidate
        id: signing
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const required = ['ANDROID_KEY_BASE64', 'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD'];
          const missing = required.filter(name => !process.env[name]?.trim());
          const signed = missing.length === 0;
          if (!signed && process.env.GITHUB_REF_TYPE === 'tag') throw new Error('Tagged releases require all persistent signing secrets: missing ' + missing.join(', '));
          appendFileSync(process.env.GITHUB_OUTPUT, `enabled=${signed}\n`);
          console.log(signed ? 'Persistent signed release build selected.' : '::notice::Unsigned compile candidate only. This artifact is not an installable release and cannot be published.');
          NODE
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android platform and NDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018'
      - name: Configure NDK
        run: echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm run tauri -- android init --ci --skip-targets-install
      - run: npm run tauri -- icon src-tauri/icons/icon.png
      - name: Configure persistent Android release signing
        if: steps.signing.outputs.enabled == 'true'
        run: node scripts/configure-android-signing.mjs
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Build ARM64 release-mode APK
        run: npm run tauri -- android build --apk --target aarch64
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_PUBLIC_APP_URL: ${{ vars.VITE_PUBLIC_APP_URL || 'https://asahi12-26.github.io/open-novel-reader/' }}
          VITE_AUTH_EMAIL_MODE: ${{ vars.VITE_AUTH_EMAIL_MODE }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Verify release signature, identity, version and ABI
        if: steps.signing.outputs.enabled == 'true'
        run: node scripts/verify-android-release.mjs
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Verify unsigned candidate identity, version and ABI
        if: steps.signing.outputs.enabled != 'true'
        run: node scripts/verify-android-release.mjs --unsigned-candidate
      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.enabled == 'true'
        with:
          name: android-arm64-release-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.enabled != 'true'
        with:
          name: android-arm64-unsigned-candidate-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/open-novel-reader-release.jks"
  prerelease:
    if: startsWith(github.ref, 'refs/tags/v') && needs.android.outputs.signed == 'true'
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: Package accompanying licenses and source notices
        run: |
          mkdir -p release-notices
          cp LICENSE THIRD_PARTY_NOTICES.md docs/RUST_DEPENDENCIES.md release-notices/
          cp -R docs/licenses release-notices/third-party
          zip -qr release-artifacts/THIRD_PARTY_LICENSES.zip release-notices
      - name: Prepare download names and checksums
        run: node scripts/prepare-release.mjs
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mapfile -d '' assets < <(find release-upload -maxdepth 1 -type f -print0)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" --prerelease --generate-notes --title "Open Novel Reader $RELEASE_TAG" --notes 'Windows installer is not Authenticode-signed. Android APK is an ARM64 release build signed with the persistent release key. Older 0.1 debug-signed Android packages cannot be upgraded in place with this certificate: export your library first. Native device validation is tracked in PROJECT_STATUS.md.'
          fi
          # Verify GitHub retained the exact names covered by SHA256SUMS.txt.
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' > uploaded-assets.txt
          for asset in "${assets[@]}"; do
            grep -Fxq "$(basename "$asset")" uploaded-assets.txt
          done
