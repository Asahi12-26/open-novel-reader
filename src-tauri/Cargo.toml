[package]
name = "open-novel-reader"
version = "0.6.1-beta.2"
description = "A local-first, open-source novel reader"
edition = "2021"
rust-version = "1.90"
license = "AGPL-3.0-only"

[lib]
name = "open_novel_reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tempfile = "3"

[target.'cfg(not(target_os = "android"))'.dependencies]
tauri-plugin-dialog = "2.8"

[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-onr-backup = { path = "plugins/onr-backup" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# Keep the development-signed Android APK usable without shipping Rust DWARF symbols.
[profile.dev]
debug = 0
strip = "debuginfo"
