name: Windows and Android builds
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['README.md', 'PROJECT_STATUS.md', 'docs/USAGE.md', 'docs/BUILD.md', 'docs/SYNC_AI.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm test
      - run: npm run tauri -- build --bundles nsis --ci
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: native-cargo-lock
          path: src-tauri/Cargo.lock
          if-no-files-found: error
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android platform and NDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018'
      - name: Configure NDK
        run: echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-beta-debug-keystore-v1
      - run: npm ci
      - run: npm run tauri -- android init --ci --skip-targets-install
      - run: npm run tauri -- icon src-tauri/icons/icon.png
      - name: Build installable ARM64 development APK
        run: npm run tauri -- android build --debug --apk --target aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: android-arm64-debug-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
  prerelease:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: Package accompanying licenses and source notices
        run: |
          mkdir -p release-notices
          cp LICENSE THIRD_PARTY_NOTICES.md docs/RUST_DEPENDENCIES.md release-notices/
          cp -R docs/licenses release-notices/third-party
          zip -qr release-artifacts/THIRD_PARTY_LICENSES.zip release-notices
      - name: Publish Beta assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mapfile -d '' assets < <(find release-artifacts -type f \( -name '*.exe' -o -name '*.apk' \) -print0)
          if [ "${#assets[@]}" -ne 2 ]; then
            echo 'Expected exactly one Windows installer and one Android APK.' >&2
            exit 1
          fi
          assets+=(release-artifacts/THIRD_PARTY_LICENSES.zip)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" --prerelease --generate-notes --title "Open Novel Reader $RELEASE_TAG" --notes 'Windows installer is not Authenticode-signed. Android APK is a debug-signed ARM64 development build; back up your library before changing signing keys. Native device validation is tracked in PROJECT_STATUS.md.'
          fi
          for asset in "${assets[@]}"; do
            printf '%s  %s\n' "$(sha256sum "$asset" | cut -d ' ' -f 1)" "$(basename "$asset")"
          done > release-artifacts/SHA256SUMS.txt
          gh release upload "$RELEASE_TAG" release-artifacts/SHA256SUMS.txt --clobber
